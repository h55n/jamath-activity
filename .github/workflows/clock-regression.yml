name: Clock regression
on:
  push:
    branches: [verify/clock-regression-40]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install real Sugar and pygame dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-sugar3 python3-pygame python3-gi gir1.2-gtk-3.0 python3-flake8
      - name: Compile and lint the regression test
        run: |
          /usr/bin/python3 -m py_compile juego.py tests/test_game_timing.py
          /usr/bin/python3 -m flake8 tests/test_game_timing.py
          git diff --check HEAD^
      - name: Run all timing regression cases
        run: /usr/bin/python3 -m unittest discover -s tests -v
